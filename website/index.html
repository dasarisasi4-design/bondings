function goBack(){showTab('Discover',document.querySelector('.nav button'))}window.addEventListener('popstate',()=>{const t=location.hash.slice(1);const match=['discover','reels','likes','chat','premium','profile'].find(x=>x===t);showTab(match?match[0].toUpperCase()+match.slice(1):'Discover')});
function renderPage(t){const x=document.querySelector('#extraView');let body='';if(t==='Likes'){const arr=people.filter((p,i)=>likes.has(i));body=`<div class="panel"><h3>Your likes</h3><p class="muted">${arr.length} profiles liked on this device.</p></div>${arr.length?'<div class="grid">'+arr.map(p=>`<article class="person"><img src="${p[3]}" alt="Profile photo"><span class="online"></span><div class="info"><div class="name">${p[0]}, ${p[1]}</div><div class="dist">${p[2]}</div></div></article>`).join('')+'</div>':'<div class="empty">No likes yet. Explore Discover and tap ♡ on profiles you like.</div>'}`}else if(t==='Chat'){body=`<div class="messages-layout"><section class="messages-main"><div class="messages-heading"><div><div class="eyebrow">YOUR CONNECTIONS</div><h3>Messages</h3><p class="muted">Stay close to the people you connect with.</p></div><button class="ghost" onclick="alert('Search chats is coming soon')">⌕ Search</button></div><div class="active-strip"><div class="active-title">Active now <span class="live-count">● 4 online</span></div><div class="active-people">${[['ravi.teja','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120'],['Aarav','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=120'],['Kiran','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120'],['Dev','https://images.unsplash.com/photo-1535713875002-d1d0cf3771d0?w=120']].map(a=>`<div class="active-person"><div class="active-avatar"><img src="${a[1]}"><i></i></div><span>${a[0]}</span></div>`).join('')}</div></div><div class="chat-list-head"><h3>Chats</h3><span class="muted">Recent conversations</span></div><button class="chat-row selected" onclick="openChatPreview()"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120"><span class="chat-copy"><b>ravi.teja</b><small>Hey! How's your day going?</small></span><span class="chat-meta"><small>Now</small><i>2</i></span></button><button class="chat-row" onclick="openChatPreview('Aarav')"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=120"><span class="chat-copy"><b>Aarav</b><small>Nice to connect with you ✨</small></span><span class="chat-meta"><small>12m</small></span></button><button class="chat-row" onclick="openChatPreview('Kiran')"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120"><span class="chat-copy"><b>Kiran</b><small>Sent you a photo</small></span><span class="chat-meta"><small>1h</small></span></button><div id="chatPreview" class="chat-preview" hidden><div class="preview-top"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120"><div><b id="previewName">ravi.teja</b><small>● Active now</small></div></div><div class="preview-messages"><div class="bubble received">Hey! How's your day going?</div><div class="bubble sent">Pretty good! Nice to hear from you 😊</div></div><div class="preview-compose"><input id="previewInput" placeholder="Write a message…"><button onclick="sendPreviewMessage()">Send</button></div><small class="muted">Preview only — live chat backend is not connected yet.</small></div></section></div>`}else if(t==='Premium'){body=`<div class="panel"><h3>Make every connection count ✨</h3><p class="muted">Choose a plan when paid features are ready.</p><div class="feature-list"><div class="feature"><span class="pill">BONDINGS PLUS</span><h2>₹199 <small class="muted">/ month</small></h2><p class="muted">More filters · See likes · Ad-free</p><button disabled>Coming soon</button></div><div class="feature"><span class="pill">BONDINGS PREMIUM</span><h2>₹399 <small class="muted">/ month</small></h2><p class="muted">Plus benefits · Boosts · Priority discovery</p><button disabled>Coming soon</button></div></div><p class="muted" style="font-size:11px">Payments are not connected. No subscription will be charged.</p></div>`}else{body=`<div class="panel"><h3>Your BONDINGS profile</h3><p class="muted">Manage your public introduction and preferences after member profile setup.</p><button class="ghost" onclick="document.querySelector('#authBtn').click()">${currentUser?'Sign out':'Sign in / Create account'}</button></div><div class="panel"><h3>Safety & community</h3><p class="muted">Be kind. Respect boundaries. Never share OTPs, passwords or financial details.</p></div>`}x.innerHTML=`<div class="subpage"><div class="subhead"><button class="back" onclick="goBack()">← Back</button><div><h2 class="section-title">${t}</h2><div class="tag">BONDINGS · Your space to connect</div></div></div>${body}</div>`}
async function refreshAuth(){const {data:{session}}=await db.auth.getSession();currentUser=session?.user||null;document.querySelector('#authBtn').textContent=currentUser?'Sign out':'Sign in'}
async function ensureProfile(){
 if(!currentUser)return false;
 const {data,error}=await db.from('profiles').select('id,display_name').eq('id',currentUser.id).maybeSingle();
 if(error)throw error;if(data)return true;
 const suggested=currentUser.user_metadata?.display_name||currentUser.email?.split('@')[0]||'Member';
 const display_name=prompt('Choose your BONDINGS display name:',suggested);
 if(!display_name||!display_name.trim())return false;
 const {error:insertError}=await db.from('profiles').insert({id:currentUser.id,display_name:display_name.trim().slice(0,40)});
 if(insertError)throw insertError;return true;
}
async function authDialog(){
 if(currentUser){const {error}=await db.auth.signOut();if(error)alert(error.message);await refreshAuth();setNotice('Signed out.');return}
 openDialog(`<h2>Welcome to BONDINGS</h2><p class="muted">Sign in or create your member account to use Reels.</p><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"><label>Display name (for new account)</label><input id="authName" maxlength="40" placeholder="Your name"><div id="authMessage" class="muted"></div><button id="signInBtn">Sign in</button> <button id="signUpBtn" class="ghost">Create account</button>`);
 document.querySelector('#signInBtn').onclick=async()=>{const email=document.querySelector('#authEmail').value.trim(),password=document.querySelector('#authPassword').value;const m=document.querySelector('#authMessage');m.textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email,password});if(error){m.textContent=error.message;return}await refreshAuth();closeDialog();setNotice('Signed in successfully.')};
 document.querySelector('#signUpBtn').onclick=async()=>{const email=document.querySelector('#authEmail').value.trim(),password=document.querySelector('#authPassword').value,name=document.querySelector('#authName').value.trim(),m=document.querySelector('#authMessage');if(!name){m.textContent='Please enter a display name.';return}if(password.length<6){m.textContent='Password must be at least 6 characters.';return}m.textContent='Creating account...';const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:name}}});if(error){m.textContent=error.message;return}if(data.session){currentUser=data.user;const {error:pe}=await db.from('profiles').upsert({id:data.user.id,display_name:name.slice(0,40)});if(pe){m.textContent='Account created, but profile setup failed: '+pe.message;return}await refreshAuth();closeDialog();setNotice('Account created. Welcome!')}else{m.textContent='Check your email to confirm your account, then sign in. Profile setup will finish after sign-in.'}};
}
document.querySelector('#authBtn').onclick=authDialog;
db.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;document.querySelector('#authBtn').textContent=currentUser?'Sign out':'Sign in'});
document.querySelector('#uploadOpen').onclick=async()=>{if(!currentUser){await authDialog();return}try{const ok=await ensureProfile();if(!ok)return;document.querySelector('#uploadMessage').textContent='';document.querySelector('#reelFile').value='';document.querySelector('#reelCaption').value='';document.querySelector('#uploadModal').style.display='flex'}catch(e){setNotice('Profile error: '+e.message)}};
document.querySelector('#uploadCancel').onclick=()=>document.querySelector('#uploadModal').style.display='none';
document.querySelector('#uploadModal').onclick=e=>{if(e.target.id==='uploadModal')e.currentTarget.style.display='none'};
document.querySelector('#uploadBtn').onclick=uploadReel;
async function uploadReel(){
 const file=document.querySelector('#reelFile').files[0],caption=document.querySelector('#reelCaption').value.trim(),msg=document.querySelector('#uploadMessage'),btn=document.querySelector('#uploadBtn');
 if(!currentUser){msg.textContent='Please sign in first.';return}
 if(!file){msg.textContent='Choose a video file first.';return}
 if(file.size>50*1024*1024){msg.textContent='Video must be 50 MB or smaller.';return}
 const allowed=['video/mp4','video/webm','video/quicktime'];if(!allowed.includes(file.type)){msg.textContent='Use an MP4, WebM or MOV video.';return}
 btn.disabled=true;msg.textContent='Uploading video...';
 try{
  const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
  const path=currentUser.id+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now())+'.'+ext;
  const {error:upErr}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
  if(upErr)throw upErr;
  msg.textContent='Saving reel details...';
  const {error:rowErr}=await db.from('reels').insert({profile_id:currentUser.id,caption,video_path:path,status:'pending'});
  if(rowErr){await db.storage.from(BUCKET).remove([path]);throw rowErr}
  msg.textContent='Uploaded! Your Reel is pending review.';
  setNotice('Reel uploaded and waiting for moderation approval.');
  setTimeout(()=>{document.querySelector('#uploadModal').style.display='none';loadReels()},900);
 }catch(e){msg.textContent='Upload failed: '+e.message}
 finally{btn.disabled=false}
}
async function loadReels(){
 const feed=document.querySelector('#reelsFeed');feed.innerHTML='<div class="empty">Loading member Reels…</div>';
 if(!currentUser){feed.innerHTML='<div class="empty">Sign in with a BONDINGS member account to watch Reels.<br><br><button onclick="document.getElementById(\"authBtn\").click()">Sign in</button></div>';return}
 try{
  const {data:rows,error}=await db.from('reels').select('id,profile_id,caption,video_path,status,created_at').or(`status.eq.approved,profile_id.eq.${currentUser.id}`).order('created_at',{ascending:false}).limit(30);
  if(error)throw error;
  if(!rows?.length){feed.innerHTML='<div class="empty">No approved Reels yet. Be the first to upload one!</div>';return}
  const profileIds=[...new Set(rows.map(r=>r.profile_id))];
  const {data:profiles,error:profileError}=await db.from('profiles').select('id,display_name,avatar_url').in('id',profileIds);
  if(profileError)throw profileError;
  const pmap=new Map((profiles||[]).map(p=>[p.id,p]));
  feed.innerHTML='';
  for(const r of rows){
   const {data:signed,error:signErr}=await db.storage.from(BUCKET).createSignedUrl(r.video_path,3600);
   const card=document.createElement('article');card.className='reel-card';
   const profile=pmap.get(r.profile_id);const title=profile?.display_name||'BONDINGS member';
   if(signErr){card.innerHTML='<div class="empty">Video is currently unavailable.</div>'}
   else{const video=document.createElement('video');video.src=signed.signedUrl;video.controls=true;video.playsInline=true;video.preload='metadata';card.append(video)}
   const meta=document.createElement('div');meta.className='reel-meta';
   const cap=document.createElement('div');cap.textContent=r.caption||'';
   const who=document.createElement('div');who.className='muted';who.style.marginTop='6px';who.textContent=title;
   meta.append(cap,who);
   if(r.status==='pending'){const s=document.createElement('div');s.className='status';s.textContent='Pending moderation';meta.append(s)}
   card.append(meta);feed.append(card);
  }
 }catch(e){feed.innerHTML='';const box=document.createElement('div');box.className='empty';box.textContent='Could not load Reels: '+e.message;feed.append(box)}
}
function openChatPreview(name='ravi.teja'){const box=document.querySelector('#chatPreview');box.hidden=false;document.querySelector('#previewName').textContent=name;box.scrollIntoView({behavior:'smooth',block:'nearest'});}
function sendPreviewMessage(){const input=document.querySelector('#previewInput');if(!input.value.trim())return;const b=document.createElement('div');b.className='bubble sent';b.textContent=input.value.trim();document.querySelector('.preview-messages').append(b);input.value='';}
refreshAuth();
</script>
</body>
